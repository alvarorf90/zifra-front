server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /config/parametros.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # El HTML trae los nombres nuevos de JS y CSS. No se guarda,
    # así el navegador pide la versión publicada en cada ingreso.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Los bundles llevan hash en el nombre: si cambia el código, cambia la URL.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # React SPA
    location / {
        try_files $uri /index.html;
    }

    # Proxy al backend
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://zifra-backend:9090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}